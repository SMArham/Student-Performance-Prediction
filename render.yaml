services:
  - type: web
    name: student-performance-api
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && python ml/train.py"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: ML_ARTIFACTS_DIR
        value: ml/artifacts
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: BACKEND_CORS_ORIGINS
        value: '["*"]'
