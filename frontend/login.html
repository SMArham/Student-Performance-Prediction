<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Student Performance Analytics</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .auth-page-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-6);
      background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.15), transparent 45%),
                  radial-gradient(circle at bottom left, rgba(16, 185, 129, 0.1), transparent 40%),
                  var(--bg-body);
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-2xl);
      padding: var(--space-8);
      box-shadow: var(--shadow-xl);
    }
    .auth-header {
      text-align: center;
      margin-bottom: var(--space-8);
    }
    .auth-logo {
      width: 48px;
      height: 48px;
      margin: 0 auto var(--space-4);
      background: linear-gradient(135deg, var(--primary-500), var(--accent-cyan));
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: var(--shadow-glow-indigo);
    }
    .divider-text {
      display: flex;
      align-items: center;
      text-align: center;
      margin: var(--space-6) 0;
      color: var(--text-muted);
      font-size: var(--font-size-xs);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .divider-text::before, .divider-text::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border-subtle);
    }
    .divider-text::before { margin-right: var(--space-3); }
    .divider-text::after { margin-left: var(--space-3); }
  </style>
</head>
<body>
  <div class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">🎓</div>
        <h1 style="font-size: var(--font-size-2xl); font-weight: 700; color: #FFFFFF; margin-bottom: var(--space-1);">Welcome Back</h1>
        <p style="color: var(--text-muted); font-size: var(--font-size-sm);">Sign in to access your AI performance analytics</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Student / Institutional Email</label>
          <input type="email" id="email" class="form-input" placeholder="student@university.edu" required autocomplete="email">
        </div>

        <div class="form-group" style="margin-bottom: var(--space-6);">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: var(--space-1);">
            <label class="form-label" for="password" style="margin-bottom:0;">Password</label>
            <a href="#" style="font-size: var(--font-size-xs); color: var(--text-accent);">Forgot password?</a>
          </div>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">
          Sign In to Dashboard
        </button>
      </form>

      <div class="divider-text">Or Explore Immediately</div>

      <button id="demo-login-btn" type="button" class="btn btn-secondary" style="width: 100%; padding: 0.75rem; border-color: var(--border-accent);">
        ⚡ Explore as Demo Student
      </button>

      <div style="text-align: center; margin-top: var(--space-6); font-size: var(--font-size-sm); color: var(--text-muted);">
        Don't have an account yet? 
        <a href="signup.html" style="font-weight: 600; color: var(--primary-400);">Create Student Account</a>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <!-- CDN Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
