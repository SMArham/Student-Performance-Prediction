<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Student Performance Prediction</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  
  <!-- Google Fonts: Barlow Condensed & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    .auth-viewport {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-6);
      background-color: var(--color-canvas);
    }
    .auth-card-panel {
      width: 100%;
      max-width: 440px;
      background: var(--color-card);
      border: 1px solid var(--border-card);
      border-radius: 22px;
      padding: var(--space-8);
      box-shadow: var(--shadow-shell);
    }
    .auth-header-block {
      text-align: center;
      margin-bottom: var(--space-6);
    }
    .auth-logo-em {
      width: 48px;
      height: 48px;
      margin: 0 auto var(--space-3);
      background: #101115;
      border: 1.5px solid var(--color-lime);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-family-display);
      font-size: 19px;
      font-weight: 800;
      color: var(--color-lime);
    }
    .auth-title-condensed {
      font-family: var(--font-family-display);
      font-size: 28px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      margin-bottom: var(--space-1);
    }
  </style>
</head>
<body>
  <div class="auth-viewport">
    <div class="auth-card-panel">
      <div class="auth-header-block">
        <div class="auth-logo-em">SP</div>
        <div style="font-family: var(--font-family-display); font-size: 23px; font-weight: 800; color: var(--color-lime); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px; line-height: 1.2;">
          Student Performance Prediction
        </div>
        <h1 class="auth-title-condensed" style="font-size: 30px; margin-bottom: 4px;">SIGN IN</h1>
        <p style="color: var(--text-secondary); font-size: 13.5px; margin-bottom: var(--space-4);">Sign in to access your educational intelligence dashboard</p>
      </div>

      <!-- Registration Success Banner (Shows when redirected from signup) -->
      <div id="registration-success-banner" style="display: none; padding: 12px 14px; background: rgba(168, 240, 75, 0.12); border: 1px solid var(--color-lime); border-radius: 12px; margin-bottom: 18px; font-size: 13px; color: #ffffff; text-align: center; line-height: 1.4;">
        ✅ <strong style="color: var(--color-lime);">Account created successfully!</strong> Please enter your password to sign in.
      </div>

      <!-- Portal Switcher Tabs -->
      <div class="auth-role-tabs" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 18px;">
        <button type="button" class="auth-role-tab active" id="login-portal-student" data-role="student" style="padding: 10px; border-radius: 10px; border: 1.5px solid var(--color-lime); background: rgba(168, 240, 75, 0.12); color: #ffffff; font-weight: 700; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s;">
          <span>🎓 Student Portal</span>
        </button>
        <button type="button" class="auth-role-tab" id="login-portal-teacher" data-role="teacher" style="padding: 10px; border-radius: 10px; border: 1.5px solid var(--border-subtle); background: rgba(255, 255, 255, 0.03); color: var(--text-muted); font-weight: 700; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s;">
          <span>👨‍🏫 Teacher Portal</span>
        </button>
      </div>
      <input type="hidden" id="login_portal_role" value="student">

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="e.g. name@university.edu or name@gmail.com" required autocomplete="email">
          <div id="email-validation-msg" style="font-size: 12px; margin-top: 5px; display: none; line-height: 1.3;"></div>
        </div>

        <div class="form-group" style="margin-bottom: var(--space-6);">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary" id="btn-login-submit" style="width: 100%; height: 46px;">
          SIGN IN AS STUDENT
        </button>
      </form>

      <div style="text-align: center; margin-top: var(--space-6); font-size: var(--font-size-sm); color: var(--text-muted);">
        Don't have an account yet? 
        <a href="signup.html" style="font-weight: 700; color: var(--color-lime);">Create Account</a>
      </div>

      <!-- Live Database Status Indicator -->
      <div id="db-health-badge" style="margin-top: 18px; padding: 9px 14px; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-subtle); border-radius: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; color: var(--text-muted);">
        <span id="db-health-dot" style="width: 8px; height: 8px; border-radius: 50%; background: #52c41a; display: inline-block; box-shadow: 0 0 6px rgba(82,196,26,0.6);"></span>
        <span id="db-health-text">Checking Database Status...</span>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <!-- CDN Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
