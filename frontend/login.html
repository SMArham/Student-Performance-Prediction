<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Student Performance Prediction</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  
  <!-- Google Fonts: Barlow Condensed & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    @media (min-width: 500px) and (min-height: 450px) {
      html, body {
        overflow-y: hidden;
      }
    }
    .auth-viewport {
      height: 100vh;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 16px;
      background-color: var(--color-canvas);
      box-sizing: border-box;
      overflow: hidden;
    }
    .auth-card-panel {
      width: 100%;
      max-width: 410px;
      background: var(--color-card);
      border: 1px solid var(--border-card);
      border-radius: 20px;
      padding: 22px 26px;
      box-shadow: var(--shadow-shell);
      box-sizing: border-box;
    }
    .auth-header-block {
      text-align: center;
      margin-bottom: 12px;
    }
    .auth-logo-em {
      width: 40px;
      height: 40px;
      margin: 0 auto 6px;
      background: #101115;
      border: 1.5px solid var(--color-lime);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-family-display);
      font-size: 16px;
      font-weight: 800;
      color: var(--color-lime);
    }
    .auth-title-condensed {
      font-family: var(--font-family-display);
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      margin-bottom: 2px;
      line-height: 1.1;
    }
    .auth-brand-subtitle {
      font-family: var(--font-family-display);
      font-size: 18px;
      font-weight: 800;
      color: var(--color-lime);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
      line-height: 1.15;
    }
    .auth-desc-text {
      color: var(--text-secondary);
      font-size: 12.5px;
      margin: 0 0 12px 0;
      line-height: 1.35;
    }
    .auth-role-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .auth-role-tabs button {
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .auth-role-tabs button.active {
      border: 1.5px solid var(--color-lime);
      background: rgba(168, 240, 75, 0.12);
      color: #ffffff;
    }
    .auth-role-tabs button:not(.active) {
      border: 1.5px solid var(--border-subtle);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-muted);
    }
    .auth-card-panel .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 10px;
    }
    .auth-card-panel .form-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin: 0;
    }
    .auth-card-panel .form-input {
      height: 40px;
      font-size: 13.5px;
      padding: 0 12px;
      border-radius: 10px;
      background-color: var(--color-control);
      border: 1px solid var(--border-control);
      color: #ffffff;
      box-sizing: border-box;
      outline: none;
    }
    .auth-card-panel .form-input:focus {
      border-color: var(--color-lime);
    }
    .btn-auth-submit {
      width: 100%;
      height: 42px;
      font-size: 13.5px;
      font-weight: 700;
      border-radius: 10px;
      margin-top: 4px;
    }
    .auth-footer-link {
      text-align: center;
      margin-top: 12px;
      font-size: 12.5px;
      color: var(--text-muted);
    }

    /* Small mobile screens */
    @media (max-height: 480px), (max-width: 480px) {
      html, body {
        height: auto !important;
        overflow-y: auto !important;
      }
      .auth-viewport {
        height: auto;
        min-height: 100vh;
        overflow-y: auto;
        padding: 16px 12px;
      }
      .auth-card-panel {
        padding: 18px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="auth-viewport">
    <div class="auth-card-panel">
      <div class="auth-header-block">
        <div class="auth-logo-em">SP</div>
        <div class="auth-brand-subtitle">
          Student Performance Prediction
        </div>
        <h1 class="auth-title-condensed">SIGN IN</h1>
        <p class="auth-desc-text">Sign in to access your educational intelligence dashboard</p>
      </div>

      <!-- Registration Success Banner (Shows when redirected from signup) -->
      <div id="registration-success-banner" style="display: none; padding: 10px 12px; background: rgba(168, 240, 75, 0.12); border: 1px solid var(--color-lime); border-radius: 10px; margin-bottom: 12px; font-size: 12.5px; color: #ffffff; text-align: center; line-height: 1.35;">
        ✅ <strong style="color: var(--color-lime);">Account created successfully!</strong> Please enter your password to sign in.
      </div>

      <!-- Portal Switcher Tabs -->
      <div class="auth-role-tabs">
        <button type="button" class="auth-role-tab active" id="login-portal-student" data-role="student">
          <span>🎓 Student Portal</span>
        </button>
        <button type="button" class="auth-role-tab" id="login-portal-teacher" data-role="teacher">
          <span>👨‍🏫 Teacher Portal</span>
        </button>
      </div>
      <input type="hidden" id="login_portal_role" value="student">

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="e.g. name@university.edu or name@gmail.com" required autocomplete="email">
          <div id="email-validation-msg" style="font-size: 11.5px; margin-top: 3px; display: none; line-height: 1.2;"></div>
        </div>

        <div class="form-group" style="margin-bottom: 14px;">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary btn-auth-submit" id="btn-login-submit">
          SIGN IN AS STUDENT
        </button>
      </form>

      <div class="auth-footer-link">
        Don't have an account yet? 
        <a href="signup.html" style="font-weight: 700; color: var(--color-lime);">Create Account</a>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <!-- CDN Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
