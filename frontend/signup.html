<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Student Performance Prediction</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  
  <!-- Google Fonts: Barlow Condensed & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    .auth-viewport {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-6);
      background-color: var(--color-canvas);
    }
    .auth-card-panel {
      width: 100%;
      max-width: 480px;
      background: var(--color-card);
      border: 1px solid var(--border-card);
      border-radius: 22px;
      padding: var(--space-8);
      box-shadow: var(--shadow-shell);
    }
    .auth-header-block {
      text-align: center;
      margin-bottom: var(--space-6);
    }
    .auth-logo-em {
      width: 48px;
      height: 48px;
      margin: 0 auto var(--space-3);
      background: #101115;
      border: 1.5px solid var(--color-lime);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-family-display);
      font-size: 19px;
      font-weight: 800;
      color: var(--color-lime);
    }
    .auth-title-condensed {
      font-family: var(--font-family-display);
      font-size: 28px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      margin-bottom: var(--space-1);
    }
  </style>
</head>
<body>
  <div class="auth-viewport">
    <div class="auth-card-panel">
      <div class="auth-header-block">
        <div class="auth-logo-em">SP</div>
        <div style="font-family: var(--font-family-display); font-size: 23px; font-weight: 800; color: var(--color-lime); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px; line-height: 1.2;">
          Student Performance Prediction
        </div>
        <h1 class="auth-title-condensed" style="font-size: 30px; margin-bottom: 4px;">CREATE ACCOUNT</h1>
        <p style="color: var(--text-secondary); font-size: 13.5px; margin-bottom: var(--space-4);">Select your role and create an account to access machine learning intelligence</p>
      </div>

      <!-- Role Selection Tabs -->
      <div class="auth-role-tabs" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 18px;">
        <button type="button" class="auth-role-tab active" id="signup-role-student" data-role="student" style="padding: 10px; border-radius: 10px; border: 1.5px solid var(--color-lime); background: rgba(168, 240, 75, 0.12); color: #ffffff; font-weight: 700; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s;">
          <span>🎓 Student</span>
        </button>
        <button type="button" class="auth-role-tab" id="signup-role-teacher" data-role="teacher" style="padding: 10px; border-radius: 10px; border: 1.5px solid var(--border-subtle); background: rgba(255, 255, 255, 0.03); color: var(--text-muted); font-weight: 700; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s;">
          <span>👨‍🏫 Teacher</span>
        </button>
      </div>
      <input type="hidden" id="account_role" value="student">

      <form id="signup-form">
        <div class="form-group">
          <label class="form-label" for="full_name" id="label-full-name">Full Name</label>
          <input type="text" id="full_name" class="form-input" placeholder="e.g. Ali Ahmed" required>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-1);">
            <label class="form-label" for="email" style="margin-bottom: 0;">Email Address</label>
            <span style="font-size: 11px; color: var(--text-muted);">Real & active emails only</span>
          </div>
          <input type="email" id="email" class="form-input" placeholder="e.g. name@university.edu or name@gmail.com" required autocomplete="email">
          <div id="email-validation-msg" style="font-size: 12px; margin-top: 5px; display: none; line-height: 1.3;"></div>
        </div>

        <!-- Dynamic Student Fields -->
        <div id="student-fields-block">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); margin-bottom: var(--space-3);">
            <div class="form-group" style="margin-bottom:0;">
              <label class="form-label" for="stage">Educational Stage</label>
              <select id="stage" class="form-select">
                <option value="university" selected>University / Higher Ed</option>
                <option value="intermediate">Matric / Intermediate</option>
                <option value="secondary">Secondary School (Grade 9-10)</option>
                <option value="primary">Primary School</option>
              </select>
            </div>
            <div class="form-group" style="margin-bottom:0;">
              <label class="form-label" for="program">Enrolled Major / Program</label>
              <input type="text" id="program" class="form-input" placeholder="e.g. Software Engineering">
            </div>
          </div>
        </div>

        <!-- Dynamic Teacher Fields (Hidden by default) -->
        <div id="teacher-fields-block" style="display: none;">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); margin-bottom: var(--space-3);">
            <div class="form-group" style="margin-bottom:0;">
              <label class="form-label" for="teacher_department">Faculty / Department</label>
              <input type="text" id="teacher_department" class="form-input" placeholder="e.g. Computer Science">
            </div>
            <div class="form-group" style="margin-bottom:0;">
              <label class="form-label" for="teacher_designation">Academic Designation</label>
              <select id="teacher_designation" class="form-select">
                <option value="Lecturer" selected>Lecturer</option>
                <option value="Assistant Professor">Assistant Professor</option>
                <option value="Associate Professor">Associate Professor</option>
                <option value="Professor">Professor</option>
                <option value="Faculty Instructor">Faculty Instructor</option>
              </select>
            </div>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3);">
          <div class="form-group">
            <label class="form-label" for="institution_name">Institution / College</label>
            <input type="text" id="institution_name" class="form-input" placeholder="e.g. Faculty of Engineering" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="gender">Gender</label>
            <select id="gender" class="form-select">
              <option value="male" selected>Male</option>
              <option value="female">Female</option>
            </select>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3);">
          <div class="form-group">
            <label class="form-label" for="password">Create Password</label>
            <input type="password" id="password" class="form-input" placeholder="Min. 6 characters" required autocomplete="new-password">
          </div>
          <div class="form-group">
            <label class="form-label" for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" class="form-input" placeholder="Repeat password" required autocomplete="new-password">
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="btn-signup-submit" style="width: 100%; height: 46px; margin-top: var(--space-3);">
          CREATE STUDENT ACCOUNT
        </button>
      </form>

      <div style="text-align: center; margin-top: var(--space-6); font-size: var(--font-size-sm); color: var(--text-muted);">
        Already have an account? 
        <a href="login.html" style="font-weight: 700; color: var(--color-lime);">Sign In here</a>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <!-- CDN Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
