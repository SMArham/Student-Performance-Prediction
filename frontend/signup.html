<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Student Performance Prediction</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  
  <!-- Google Fonts: Barlow Condensed & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    .auth-viewport {
      height: 100vh;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 16px;
      background-color: var(--color-canvas);
      box-sizing: border-box;
      overflow: hidden;
    }
    .auth-card-panel {
      width: 100%;
      max-width: 530px;
      background: var(--color-card);
      border: 1px solid var(--border-card);
      border-radius: 20px;
      padding: 18px 24px;
      box-shadow: var(--shadow-shell);
      box-sizing: border-box;
    }
    .auth-header-block {
      text-align: center;
      margin-bottom: 8px;
    }
    .auth-logo-em {
      width: 36px;
      height: 36px;
      margin: 0 auto 4px;
      background: #101115;
      border: 1.5px solid var(--color-lime);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-family-display);
      font-size: 15px;
      font-weight: 800;
      color: var(--color-lime);
    }
    .auth-brand-subtitle {
      font-family: var(--font-family-display);
      font-size: 16px;
      font-weight: 800;
      color: var(--color-lime);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 2px;
      line-height: 1.15;
    }
    .auth-title-condensed {
      font-family: var(--font-family-display);
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      margin-bottom: 2px;
      line-height: 1.1;
    }
    .auth-desc-text {
      color: var(--text-secondary);
      font-size: 12px;
      margin: 0 0 8px 0;
      line-height: 1.3;
    }
    .auth-role-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    .auth-role-tabs button {
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .auth-role-tabs button.active {
      border: 1.5px solid var(--color-lime);
      background: rgba(168, 240, 75, 0.12);
      color: #ffffff;
    }
    .auth-role-tabs button:not(.active) {
      border: 1.5px solid var(--border-subtle);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-muted);
    }
    .signup-grid-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 7px;
    }
    .auth-card-panel .form-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-bottom: 0;
    }
    .auth-card-panel .form-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin: 0;
    }
    .auth-card-panel .form-input,
    .auth-card-panel .form-select {
      height: 38px;
      font-size: 13px;
      padding: 0 10px;
      border-radius: 8px;
      background-color: var(--color-control);
      border: 1px solid var(--border-control);
      color: #ffffff;
      box-sizing: border-box;
      outline: none;
    }
    .auth-card-panel .form-input:focus,
    .auth-card-panel .form-select:focus {
      border-color: var(--color-lime);
    }
    .btn-auth-submit {
      width: 100%;
      height: 40px;
      font-size: 13.5px;
      font-weight: 700;
      border-radius: 8px;
      margin-top: 5px;
    }
    .auth-footer-link {
      text-align: center;
      margin-top: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Responsive adjustments for smaller screens */
    @media (max-height: 570px), (max-width: 540px) {
      .auth-viewport {
        height: auto;
        min-height: 100vh;
        overflow-y: auto;
        padding: 14px 10px;
      }
      .auth-card-panel {
        padding: 16px 16px;
      }
    }
    @media (max-width: 440px) {
      .signup-grid-row {
        grid-template-columns: 1fr;
        gap: 6px;
        margin-bottom: 6px;
      }
      .auth-card-panel .form-group {
        margin-bottom: 2px;
      }
    }
  </style>
</head>
<body>
  <div class="auth-viewport">
    <div class="auth-card-panel">
      <div class="auth-header-block">
        <div class="auth-logo-em">SP</div>
        <div class="auth-brand-subtitle">
          Student Performance Prediction
        </div>
        <h1 class="auth-title-condensed">CREATE ACCOUNT</h1>
        <p class="auth-desc-text">Select your role and create an account to access machine learning intelligence</p>
      </div>

      <!-- Role Selection Tabs -->
      <div class="auth-role-tabs">
        <button type="button" class="auth-role-tab active" id="signup-role-student" data-role="student">
          <span>🎓 Student</span>
        </button>
        <button type="button" class="auth-role-tab" id="signup-role-teacher" data-role="teacher">
          <span>👨‍🏫 Teacher</span>
        </button>
      </div>
      <input type="hidden" id="account_role" value="student">

      <form id="signup-form">
        <!-- Row 1: Full Name & Email Address -->
        <div class="signup-grid-row">
          <div class="form-group">
            <label class="form-label" for="full_name" id="label-full-name">Full Name</label>
            <input type="text" id="full_name" class="form-input" placeholder="e.g. Ali Ahmed" required>
          </div>

          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <label class="form-label" for="email">Email Address</label>
              <span style="font-size: 10px; color: var(--text-muted);">Real & active</span>
            </div>
            <input type="email" id="email" class="form-input" placeholder="name@domain.com" required autocomplete="email">
            <div id="email-validation-msg" style="font-size: 11px; margin-top: 2px; display: none; line-height: 1.2;"></div>
          </div>
        </div>

        <!-- Row 2 (Student): Educational Stage & Program -->
        <div id="student-fields-block">
          <div class="signup-grid-row">
            <div class="form-group">
              <label class="form-label" for="stage">Educational Stage</label>
              <select id="stage" class="form-select">
                <option value="university" selected>University / Higher Ed</option>
                <option value="intermediate">Matric / Intermediate</option>
                <option value="secondary">Secondary School (Grade 9-10)</option>
                <option value="primary">Primary School</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="program">Enrolled Major / Program</label>
              <input type="text" id="program" class="form-input" placeholder="e.g. Software Engineering">
            </div>
          </div>
        </div>

        <!-- Row 2 (Teacher): Department & Designation -->
        <div id="teacher-fields-block" style="display: none;">
          <div class="signup-grid-row">
            <div class="form-group">
              <label class="form-label" for="teacher_department">Faculty / Department</label>
              <input type="text" id="teacher_department" class="form-input" placeholder="e.g. Computer Science">
            </div>
            <div class="form-group">
              <label class="form-label" for="teacher_designation">Academic Designation</label>
              <select id="teacher_designation" class="form-select">
                <option value="Lecturer" selected>Lecturer</option>
                <option value="Assistant Professor">Assistant Professor</option>
                <option value="Associate Professor">Associate Professor</option>
                <option value="Professor">Professor</option>
                <option value="Faculty Instructor">Faculty Instructor</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Row 3: Institution & Gender -->
        <div class="signup-grid-row">
          <div class="form-group">
            <label class="form-label" for="institution_name">Institution / College</label>
            <input type="text" id="institution_name" class="form-input" placeholder="e.g. Faculty of Engineering" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="gender">Gender</label>
            <select id="gender" class="form-select">
              <option value="male" selected>Male</option>
              <option value="female">Female</option>
            </select>
          </div>
        </div>

        <!-- Row 4: Password & Confirm Password -->
        <div class="signup-grid-row">
          <div class="form-group">
            <label class="form-label" for="password">Create Password</label>
            <input type="password" id="password" class="form-input" placeholder="Min. 6 characters" required autocomplete="new-password">
          </div>
          <div class="form-group">
            <label class="form-label" for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" class="form-input" placeholder="Repeat password" required autocomplete="new-password">
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-auth-submit" id="btn-signup-submit">
          CREATE STUDENT ACCOUNT
        </button>
      </form>

      <div class="auth-footer-link">
        Already have an account? 
        <a href="login.html" style="font-weight: 700; color: var(--color-lime);">Sign In here</a>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <!-- CDN Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
