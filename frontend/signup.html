<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Student Performance Prediction</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  
  <!-- Google Fonts: Barlow Condensed & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    .auth-viewport {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-6);
      background-color: var(--color-canvas);
    }
    .auth-card-panel {
      width: 100%;
      max-width: 480px;
      background: var(--color-card);
      border: 1px solid var(--border-card);
      border-radius: 22px;
      padding: var(--space-8);
      box-shadow: var(--shadow-shell);
    }
    .auth-header-block {
      text-align: center;
      margin-bottom: var(--space-6);
    }
    .auth-logo-em {
      width: 48px;
      height: 48px;
      margin: 0 auto var(--space-3);
      background: #101115;
      border: 1.5px solid var(--color-lime);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-family-display);
      font-size: 19px;
      font-weight: 800;
      color: var(--color-lime);
    }
    .auth-title-condensed {
      font-family: var(--font-family-display);
      font-size: 28px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      margin-bottom: var(--space-1);
    }
  </style>
</head>
<body>
  <div class="auth-viewport">
    <div class="auth-card-panel">
      <div class="auth-header-block">
        <div class="auth-logo-em">SP</div>
        <div style="font-family: var(--font-family-display); font-size: 23px; font-weight: 800; color: var(--color-lime); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px; line-height: 1.2;">
          Student Performance Prediction
        </div>
        <h1 class="auth-title-condensed" style="font-size: 30px; margin-bottom: 4px;">SIGN UP</h1>
        <p style="color: var(--text-secondary); font-size: 13.5px; margin-bottom: var(--space-4);">Create an account to access machine learning performance forecasts</p>
      </div>

      <form id="signup-form">
        <div class="form-group">
          <label class="form-label" for="full_name">Full Name</label>
          <input type="text" id="full_name" class="form-input" placeholder="e.g. Ali" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" class="form-input" placeholder="e.g. name@email.com" required autocomplete="email">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3);">
          <div class="form-group">
            <label class="form-label" for="institution_name">Institution Name</label>
            <input type="text" id="institution_name" class="form-input" placeholder="e.g. Faculty of Engineering" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="program">Enrolled Program</label>
            <input type="text" id="program" class="form-input" placeholder="e.g. Software Engineering" required>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3);">
          <div class="form-group">
            <label class="form-label" for="account_role">Account Type</label>
            <select id="account_role" class="form-select">
              <option value="student" selected>Student</option>
              <option value="teacher">Teacher</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="gender">Gender</label>
            <select id="gender" class="form-select">
              <option value="male" selected>Male</option>
              <option value="female">Female</option>
            </select>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3);">
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" class="form-input" placeholder="Min. 6 chars" required autocomplete="new-password">
          </div>
          <div class="form-group">
            <label class="form-label" for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" class="form-input" placeholder="Repeat password" required autocomplete="new-password">
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; height: 46px; margin-top: var(--space-3);">
          SIGN UP TO DASHBOARD
        </button>
      </form>

      <div style="text-align: center; margin-top: var(--space-6); font-size: var(--font-size-sm); color: var(--text-muted);">
        Already have an account? 
        <a href="login.html" style="font-weight: 700; color: var(--color-lime);">Sign In</a>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <!-- CDN Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
