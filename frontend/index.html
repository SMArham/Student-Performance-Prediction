<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Performance Prediction & Analytics System</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (window.authClient && window.authClient.isAuthenticated()) {
        window.location.href = "dashboard.html";
      } else {
        window.location.href = "login.html";
      }
    });
  </script>
</head>
<body style="display:flex;align-items:center;justify-content:center;height:100vh;">
  <div style="text-align:center;">
    <div class="brand-logo-icon" style="margin:0 auto var(--space-4);width:48px;height:48px;font-size:24px;">🎓</div>
    <h2 style="font-weight:700;margin-bottom:var(--space-2);">Student Performance AI</h2>
    <p style="color:var(--text-muted);font-size:var(--font-size-sm);">Routing to your dashboard...</p>
  </div>
</body>
</html>
